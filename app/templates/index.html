<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/venooxslocal</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,700,700i|Raleway:300,400,500,700,800"
        rel="stylesheet">

    <!-- Bootstrap CSS File -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: 'Courier New', monospace;
            color: white;
        }

        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding-top: 20vh;
            text-shadow: 2px 2px 4px rgba(0, 255, 0, 0.4);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        .posts {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 3rem;
        }

        .card {
            width: 100%;
            max-width: 100%;
            margin-bottom: 1.25rem;
            background-color: #050505;
            color: #fefefe;
            border: none;
        }
        .card-title{
            text-decoration: none;
            font-size: 1.5rem;
        }
        .card-title:hover{
            color: #585858;
            transition: all 0.5s;
        }
    </style>
</head>

<body>
    <canvas id="matrix"></canvas>

    <div class="content">
        <h1>/venooxslocal</h1>
        <p>Welcome to my CTI blog.</p>
    </div>
    <div class="posts">
        {% for post in posts%}
        <div class="card mb-3">
            <div class="row g-0">
                <div class="col-md-8">
                    <div class="card-body">
                        <a href="{% url 'post' post.id %}" class="card-title">{{post.title}}</a>
                        <p class="card-text">{{post.content | safe |truncatechars:23}}</p>
                        <p class="card-text"><small class="text-body-secondary">Published Date: {{post.created_at}}</small></p>
                    </div>
                </div>
            </div>
        </div>
        {%endfor%}
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const letters = "01".split("");
        const fontSize = 14;
        const columns = canvas.width / fontSize;

        const drops = Array.from({ length: columns }, () => 1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#4d4d4d";
            ctx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        setInterval(draw, 33);

        // Resize event
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>

</html>
